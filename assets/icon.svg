<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <!-- Overlay Shadow & Highlights -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Lens Gradient -->
    <radialGradient id="lensGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Glass Shimmer Top Half -->
  <rect x="32" y="32" width="448" height="224" rx="104" fill="url(#glassGrad)" />

  <!-- Crop / Selection Frame (Dashed & Corners) -->
  <!-- Top Left Corner -->
  <path d="M 120 180 L 120 136 Q 120 120 136 120 L 180 120" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top Right Corner -->
  <path d="M 332 120 L 376 120 Q 392 120 392 136 L 392 180" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Left Corner -->
  <path d="M 120 332 L 120 376 Q 120 392 136 392 L 180 392" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Right Corner -->
  <path d="M 332 392 L 376 392 Q 392 392 392 376 L 392 332" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Aperture / Camera Lens -->
  <circle cx="256" cy="256" r="92" fill="url(#lensGrad)" stroke="#FFFFFF" stroke-width="14" />
  <circle cx="256" cy="256" r="48" fill="#0F172A" opacity="0.65" />
  
  <!-- Lens Flare Highlight -->
  <ellipse cx="232" cy="226" rx="28" ry="16" transform="rotate(-30 232 226)" fill="#FFFFFF" opacity="0.75" />

  <!-- Feather / Light Ray Accent (Inspired by Lightshot) -->
  <path d="M 350 162 C 375 140, 410 148, 420 130 C 405 170, 375 190, 350 200 Z" fill="#FDE047" opacity="0.9" />
</svg>
