name: LocalShot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. CI Job: Formatting, Clippy, Compilation & Tests
  check-and-test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxi-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check Compilation
        run: cargo check --all-targets

      - name: Run All Unit & Headless Tests
        run: cargo test --verbose

      - name: Run Headless & Golden-Image Tests
        run: cargo test --test headless --test golden_draw --verbose

  # 2. Security Audit & Dependency Policy (cargo-audit + cargo-deny)
  security-audit:
    name: Security Audit & License Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Cargo Audit
        run: cargo audit

      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  # 3. CD Job: Build Release Artifacts (Runs only on version tags like v0.1.0)
  build-release:
    name: Build Release (${{ matrix.target }})
    needs: [check-and-test, security-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: localshot-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: localshot-linux-x86_64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxi-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Windows Artifact Packaging & Inno Setup Installer Build
      - name: Build Windows Installer & Zip
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path target\release)) { New-Item -ItemType Directory -Path target\release | Out-Null }
          Copy-Item target\${{ matrix.target }}\release\localshot.exe target\release\localshot.exe -Force

          & powershell -ExecutionPolicy Bypass -File .\scripts\make_icon.ps1

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc scripts\installer.iss
          } else {
            iscc scripts\installer.iss
          }

          if (-not (Test-Path dist)) { New-Item -ItemType Directory -Path dist | Out-Null }
          Compress-Archive -Path target\${{ matrix.target }}\release\localshot.exe -DestinationPath dist\localshot-windows-x86_64.zip

      # Linux Artifact Packaging
      - name: Build Linux Archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czvf dist/localshot-linux-x86_64.tar.gz -C target/${{ matrix.target }}/release localshot

      - name: Upload Build Artifacts for Checksum & Signing
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz

  # 4. Publish Release: SHA256SUMS + Optional Minisign Signature
  publish-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign Release Artifacts with Minisign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        working-directory: dist
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::warning::MINISIGN_KEY secret is not configured; skipping Minisign signatures."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_KEY" > /tmp/localshot.key
          chmod 600 /tmp/localshot.key
          trap 'rm -f /tmp/localshot.key' EXIT
          for f in SHA256SUMS *.exe *.zip *.tar.gz; do
            [ -e "$f" ] || continue
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s /tmp/localshot.key -m "$f" -t "LocalShot ${GITHUB_REF_NAME}"
          done

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.minisig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
