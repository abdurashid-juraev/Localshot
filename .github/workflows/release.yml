name: LocalShot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. CI Job: Code Quality & Tests (Runs on all pushes and PRs)
  check-and-test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxi-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Compilation
        run: cargo check --all-targets

      - name: Run Test Suite
        run: cargo test --verbose

  # 2. CD Job: Build Release Artifacts (Runs only on version tags like v0.1.0)
  build-release:
    name: Build Release (${{ matrix.target }})
    needs: check-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: localshot-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: localshot-linux-x86_64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxi-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Windows Artifact Packaging & Inno Setup Installer Build
      - name: Build Windows Installer & Zip
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Generate icons if needed
          & powershell -ExecutionPolicy Bypass -File .\assets\make_icon.ps1
          
          # Compile Inno Setup installer
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc installer.iss
          } else {
            iscc installer.iss
          }

          # Zip standalone binary
          Compress-Archive -Path target\${{ matrix.target }}\release\localshot.exe -DestinationPath dist\localshot-windows-x86_64.zip

      # Linux Artifact Packaging
      - name: Build Linux Archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czvf dist/localshot-linux-x86_64.tar.gz -C target/${{ matrix.target }}/release localshot

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
