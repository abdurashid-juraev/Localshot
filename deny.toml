[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # chrono 0.4.45 is used by localshot and i-slint-core; no drop-in upgrade in 0.4.x
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "0BSD",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
